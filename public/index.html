<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161e">
<title>Anura Browser</title>
<style>
:root{color-scheme:dark;--bg:#11161e;--panel:#19212c;--panel2:#222d3a;--line:#303d4d;--text:#edf2f8;--muted:#94a2b4;--accent:#83b4ff;--accent-bg:#263f60}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{color:inherit;cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;position:relative}.header{height:54px;min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-weight:800;font-size:18px}.brand-name{font-weight:700}.brand-sub{font-size:10px;color:var(--muted)}.actions{display:flex;gap:5px}.icon{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}.icon:hover{background:var(--panel2);color:var(--text)}.icon svg,.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tabbar{height:39px;min-height:39px;display:flex;gap:5px;padding:4px 10px 0;background:var(--panel);border-bottom:1px solid var(--line)}.tabs{display:flex;gap:5px;flex:1;overflow:auto;scrollbar-width:none}.tab{min-width:95px;max-width:180px;flex:0 1 160px;display:flex;align-items:center;gap:7px;padding:0 9px;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;color:var(--muted);font-size:12px}.tab.active{background:var(--bg);border-color:var(--line);color:var(--text)}.tab-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab-close{border:0;background:transparent;color:var(--muted)}.new-tab{width:30px;border:0;background:transparent;color:var(--muted);font-size:20px}.toolbar{height:49px;min-height:49px;display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line)}.nav{width:32px;height:32px;flex-shrink:0;border:0;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center}.nav:disabled{opacity:.3}.address{height:34px;min-width:0;flex:1;display:flex;align-items:center;gap:8px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.address:focus-within{border-color:var(--accent)}.address input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}.go{border:0;border-radius:6px;background:var(--accent-bg);color:var(--accent);padding:5px 10px}.browser{position:relative;flex:1;min-height:0;background:white;overflow:hidden}.frames{position:absolute;inset:0}.frame{display:none;width:100%;height:100%;border:0;background:white}.frame.active{display:block}.home{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#27394e,#11161e 72%)}.home.hidden{display:none}.home-inner{width:min(530px,100%);text-align:center}.home-mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:#263f60;color:#acd0ff;font-size:30px;font-weight:800}.home h1{margin:0;font-size:30px;letter-spacing:-1px}.sub{margin:9px 0 25px;color:#9aaabd}.search{height:48px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid #3b4b5f;border-radius:9px;background:#1b2633}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white}.search button{border:0;border-radius:6px;background:#2b4c72;color:#c5ddff;padding:7px 11px}.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px}.shortcut{padding:9px 12px;border:1px solid #344457;border-radius:8px;background:#1b2633;color:#d0d9e5;font-size:11px}.status{height:25px;min-height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:10px}.loading{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);padding:8px 12px;border:1px solid #405064;border-radius:8px;background:#1b2633;color:white;font-size:11px}.loading.hidden{display:none}.panel{position:absolute;z-index:12;right:10px;top:60px;width:min(340px,calc(100vw - 20px));max-height:70vh;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 12px 40px #0006}.panel.hidden{display:none}.panel-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}.event{padding:8px;margin-top:6px;background:var(--panel2);border-radius:7px;font-size:11px;overflow-wrap:anywhere}.event small{display:block;color:var(--muted);margin-top:3px}.clear{width:100%;margin-top:9px;padding:8px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted)}.focus .header,.focus .tabbar,.focus .toolbar,.focus .status{display:none}.focus .browser{position:fixed;inset:0;width:100%;height:100dvh;z-index:20}.focus-exit{display:none;position:fixed;z-index:100;top:12px;right:12px;width:39px;height:39px;place-items:center;border:1px solid #ffffff30;border-radius:9px;background:#17202c;color:white;opacity:.2;backdrop-filter:blur(8px)}.focus .focus-exit{display:grid}.focus-exit:hover,.focus-exit:focus-visible{opacity:1}.focus-exit svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.light{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--panel2:#edf1f6;--line:#dce2ea;--text:#202938;--muted:#738196;--accent:#2868bf;--accent-bg:#e4eefc}.light .home{background:radial-gradient(ellipse at 50% 40%,#e2ebf8,#f4f6f9 75%)}.light .home-mark{background:#e4edfb;color:#285c9e}.light .sub{color:#738196}.light .search{background:#fff;border-color:#dce2ea}.light .search input{color:#202938}.light .shortcut{background:#fff;color:#45536a;border-color:#dce2ea}.light .shortcut:hover{background:#edf3fc}@media(max-width:600px){.header{padding:0 10px}.brand-sub{display:none}.toolbar{gap:2px;padding:5px 5px}.nav{width:28px}.address{gap:4px;padding:0 6px}.go{padding:5px 7px}.home h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="brand"><div class="mark">A</div><div><div class="brand-name">Anura Browser</div><div class="brand-sub">Web workspace · V3</div></div></div>
    <div class="actions">
      <button class="icon" id="securityBtn" title="Security Lab" aria-label="Security Lab">◈</button>
      <button class="icon" id="themeBtn" title="Change theme" aria-label="Change theme">◐</button>
      <button class="icon" id="focusBtn" title="Ẩn tất cả" aria-label="Ẩn tất cả">⛶</button>
    </div>
  </header>
  <section class="tabbar"><div class="tabs" id="tabs"></div><button class="new-tab" id="newTab" title="New tab">+</button></section>
  <section class="toolbar">
    <button class="nav" id="back" title="Back">‹</button>
    <button class="nav" id="forward" title="Forward">›</button>
    <button class="nav" id="reload" title="Reload">↻</button>
    <button class="nav" id="homeBtn" title="Home">⌂</button>
    <form class="address" id="addressForm"><span>⌕</span><input id="address" placeholder="Search or enter URL" autocomplete="off" spellcheck="false"><button class="go">Go</button></form>
    <button class="nav" id="external" title="Open externally">↗</button>
  </section>
  <main class="browser">
    <div class="frames" id="frames"></div>
    <section class="home" id="home"><div class="home-inner">
      <div class="home-mark">A</div><h1>Anura Browser</h1><p class="sub">A quieter way to browse the web.</p>
      <form class="search" id="homeForm"><span>⌕</span><input id="homeInput" placeholder="Search or enter a website"><button>→</button></form>
      <div class="shortcuts">
        <button class="shortcut" data-url="https://www.google.com">Google</button>
        <button class="shortcut" data-url="https://github.com">GitHub</button>
        <button class="shortcut" data-url="https://wikipedia.org">Wikipedia</button>
      </div>
    </div></section>
    <div class="loading hidden" id="loading">Loading website…</div>
  </main>
  <footer class="status"><span id="status">Ready</span><span id="apiStatus">API: checking…</span></footer>
  <aside class="panel hidden" id="securityPanel">
    <div class="panel-head"><span>Anura Security Lab</span><button class="icon" id="closePanel">×</button></div>
    <div class="event" id="liveStatus">Visibility: checking…</div>
    <div id="events"></div>
    <button class="clear" id="clearEvents">Clear local events</button>
  </aside>
  <button class="focus-exit" id="exitFocus" title="Show browser controls (Esc)" aria-label="Show browser controls">⛶</button>
</div>
<script type="module">
// Frontend Security Lab is kept inline so the complete UI remains one HTML file.
class VisibilityMonitor {
  constructor() {
    this.events = [];
    this.maxEvents = 100;
  }
  snapshot() {
    return {
      visibility: document.visibilityState || "unknown",
      hidden: Boolean(document.hidden),
      focused: Boolean(document.hasFocus?.()),
      timestamp: new Date().toISOString()
    };
  }
  record(type) {
    const event = { type, ...this.snapshot() };
    this.events.unshift(event);
    if (this.events.length > this.maxEvents) this.events.pop();
    window.dispatchEvent(new CustomEvent("anura:visibility", { detail: event }));
    return event;
  }
  start() {
    document.addEventListener("visibilitychange", () => this.record("visibilitychange"));
    window.addEventListener("focus", () => this.record("focus"));
    window.addEventListener("blur", () => this.record("blur"));
    window.addEventListener("pageshow", () => this.record("pageshow"));
    window.addEventListener("pagehide", () => this.record("pagehide"));
    this.record("initialized");
  }
}
class AuditLogger {
  constructor(maxEntries = 100) { this.maxEntries = maxEntries; this.entries = []; }
  log(input = {}) {
    const allowed = new Set(["visible", "hidden", "prerender", "unloaded"]);
    const event = {
      type: String(input.type || "unknown").slice(0, 40),
      visibility: allowed.has(input.visibility) ? input.visibility : (input.visibility || "unknown"),
      hidden: Boolean(input.hidden),
      focused: Boolean(input.focused),
      timestamp: input.timestamp || new Date().toISOString()
    };
    this.entries.unshift(event);
    if (this.entries.length > this.maxEntries) this.entries.pop();
    return event;
  }
  getAll() { return this.entries.map(item => ({ ...item })); }
  clear() { this.entries = []; }
}
class SecurityManager {
  constructor() {
    this.visibility = new VisibilityMonitor();
    this.audit = new AuditLogger();
    this.started = false;
  }
  start() {
    if (this.started) return;
    this.started = true;
    this.visibility.start();
    window.addEventListener("anura:visibility", event => this.audit.log(event.detail));
    this.audit.log({ type: "security_initialized" });
  }
  validateUrl(input) {
    let parsed;
    try { parsed = new URL(input); }
    catch { return { allowed: false, reason: "Malformed URL" }; }
    if (!["http:", "https:"].includes(parsed.protocol)) {
      return { allowed: false, reason: "Only HTTP and HTTPS are supported" };
    }
    if (!parsed.hostname || parsed.username || parsed.password) {
      return { allowed: false, reason: "Invalid URL authority" };
    }
    if (parsed.origin === location.origin) {
      return { allowed: false, reason: "Embedding the Anura origin is blocked" };
    }
    return { allowed: true, url: parsed.href };
  }
}

const $ = id => document.getElementById(id);
const HISTORY_KEY = "anura_v3_history";
const THEME_KEY = "anura_v3_theme";
const security = new SecurityManager();
security.start();

let tabs = [];
let activeId = null;
let nextId = 1;
let focusMode = false;
let loadTimer = null;

function status(text){ $("status").textContent = text; }
function getActive(){ return tabs.find(t => t.id === activeId); }
function normalize(input){
  const value = String(input || "").trim();
  if(!value) return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)){
    if(value.includes(" ") || !value.includes(".")){
      return "https://www.google.com/search?q=" + encodeURIComponent(value);
    }
    return "https://" + value;
  }
  return value;
}
function showLoading(){ $("loading").classList.remove("hidden"); }
function hideLoading(){ $("loading").classList.add("hidden"); }

function createTab(url=null){
  const id = nextId++;
  const frame = document.createElement("iframe");
  frame.className = "frame";
  frame.title = "Website content";
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  frame.setAttribute("sandbox","allow-scripts allow-forms allow-same-origin allow-popups");
  const tab = {id,url:null,title:"New Tab",history:[],index:-1,frame,loading:false};
  frame.addEventListener("load",()=>{
    tab.loading=false;
    if(activeId===id){clearTimeout(loadTimer);hideLoading();status("Page loaded");}
  });
  $("frames").appendChild(frame);
  tabs.push(tab);
  activate(id);
  if(url) navigate(url);
}
function activate(id){
  activeId=id;
  tabs.forEach(t=>t.frame.classList.toggle("active",t.id===id));
  renderTabs();
  const tab=getActive();
  $("home").classList.toggle("hidden",!!tab?.url);
  $("address").value=tab?.url || "";
  if(tab?.loading) showLoading(); else hideLoading();
  updateButtons();
}
function renderTabs(){
  $("tabs").replaceChildren();
  tabs.forEach(tab=>{
    const button=document.createElement("button");
    button.className="tab"+(tab.id===activeId?" active":"");
    const title=document.createElement("span");
    title.className="tab-title"; title.textContent=tab.title;
    const close=document.createElement("span");
    close.className="tab-close"; close.textContent="×";
    close.addEventListener("click",e=>{e.stopPropagation();closeTab(tab.id);});
    button.append(title,close);
    button.addEventListener("click",()=>activate(tab.id));
    $("tabs").append(button);
  });
}
function closeTab(id){
  const index=tabs.findIndex(t=>t.id===id);
  if(index<0)return;
  const wasActive=activeId===id;
  tabs[index].frame.remove(); tabs.splice(index,1);
  if(!tabs.length){createTab();return;}
  if(wasActive)activate(tabs[Math.max(0,index-1)].id);else renderTabs();
}
function saveHistory(url){
  try{
    const old=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
    old.unshift({url,time:Date.now()});
    localStorage.setItem(HISTORY_KEY,JSON.stringify(old.slice(0,100)));
  }catch{}
}
function navigate(raw){
  const url=normalize(raw);
  if(!url){status("Enter a valid URL");return;}
  const result=security.validateUrl(url);
  if(!result.allowed){status("Blocked: "+result.reason);security.audit.log({type:"url_rejected"});renderEvents();return;}
  const tab=getActive(); if(!tab)return;
  tab.url=result.url; tab.title=new URL(result.url).hostname;
  tab.history=tab.history.slice(0,tab.index+1); tab.history.push(result.url); tab.index++;
  tab.loading=true; $("address").value=result.url; $("home").classList.add("hidden");
  showLoading(); status("Loading website…");
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{tab.loading=false;if(activeId===tab.id){hideLoading();status("Timed out or website blocks iframe");}},20000);
  saveHistory(result.url);
  tab.frame.src=result.url;
  renderTabs(); updateButtons();
  security.audit.log({type:"navigation_started"});
  renderEvents();
}
function moveHistory(delta){
  const tab=getActive(); if(!tab)return;
  const next=tab.index+delta;
  if(next<0||next>=tab.history.length)return;
  tab.index=next; tab.url=tab.history[next]; tab.title=new URL(tab.url).hostname;
  tab.loading=true; $("address").value=tab.url; showLoading();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{tab.loading=false;if(activeId===tab.id){hideLoading();status("Timed out");}},20000);
  tab.frame.src=tab.url; $("home").classList.add("hidden"); renderTabs();updateButtons();
}
function reload(){
  const tab=getActive(); if(!tab?.url)return;
  tab.loading=true;showLoading();status("Reloading…");
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{tab.loading=false;if(activeId===tab.id){hideLoading();status("Timed out");}},20000);
  tab.frame.src=tab.url;
}
function goHome(){
  const tab=getActive();if(!tab)return;
  tab.url=null;tab.title="New Tab";tab.history=[];tab.index=-1;tab.loading=false;
  tab.frame.removeAttribute("src");$("address").value="";$("home").classList.remove("hidden");
  clearTimeout(loadTimer);hideLoading();renderTabs();updateButtons();status("Home");
}
function updateButtons(){
  const t=getActive();
  $("back").disabled=!t||t.index<=0;
  $("forward").disabled=!t||t.index>=t.history.length-1;
  $("reload").disabled=!t?.url;
  $("external").disabled=!t?.url;
}
function enterFocus(){focusMode=true;$("app").classList.add("focus");}
function exitFocus(){focusMode=false;$("app").classList.remove("focus");}
$("focusBtn").addEventListener("click",enterFocus);
$("exitFocus").addEventListener("click",exitFocus);
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==="Escape"&&focusMode)exitFocus();
  if(mod&&e.key.toLowerCase()==="t"){e.preventDefault();createTab();}
  if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();closeTab(activeId);}
  if(mod&&e.key.toLowerCase()==="r"){e.preventDefault();reload();}
  if(mod&&e.key.toLowerCase()==="l"&&!focusMode){e.preventDefault();$("address").focus();$("address").select();}
  if(e.altKey&&e.key==="ArrowLeft")moveHistory(-1);
  if(e.altKey&&e.key==="ArrowRight")moveHistory(1);
});
$("addressForm").addEventListener("submit",e=>{e.preventDefault();navigate($("address").value);});
$("homeForm").addEventListener("submit",e=>{e.preventDefault();navigate($("homeInput").value);});
$("back").addEventListener("click",()=>moveHistory(-1));
$("forward").addEventListener("click",()=>moveHistory(1));
$("reload").addEventListener("click",reload);
$("homeBtn").addEventListener("click",goHome);
$("external").addEventListener("click",()=>{const t=getActive();if(t?.url)window.open(t.url,"_blank","noopener,noreferrer");});
$("newTab").addEventListener("click",()=>createTab());
document.querySelectorAll("[data-url]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.url)));

function setTheme(theme){
  document.body.classList.toggle("light",theme==="light");
  try{localStorage.setItem(THEME_KEY,theme);}catch{}
}
$("themeBtn").addEventListener("click",()=>{
  setTheme(document.body.classList.contains("light")?"dark":"light");
});

function renderEvents(){
  const snapshot=security.visibility.snapshot();
  $("liveStatus").textContent=`Visibility: ${snapshot.visibility} · Hidden: ${snapshot.hidden} · Focused: ${snapshot.focused}`;
  const list=$("events");list.replaceChildren();
  security.audit.getAll().slice(0,20).forEach(item=>{
    const row=document.createElement("div");row.className="event";
    row.textContent=`${item.type} · ${item.visibility || "n/a"}`;
    const small=document.createElement("small");small.textContent=item.timestamp;
    row.append(small);list.append(row);
  });
}
$("securityBtn").addEventListener("click",()=>{
  renderEvents();$("securityPanel").classList.toggle("hidden");
});
$("closePanel").addEventListener("click",()=>$("securityPanel").classList.add("hidden"));
$("clearEvents").addEventListener("click",()=>{security.audit.clear();renderEvents();});
window.addEventListener("anura:visibility",renderEvents);

async function checkApi(){
  try{
    const response=await fetch("/api/health",{headers:{Accept:"application/json"}});
    if(!response.ok)throw new Error("API unavailable");
    const data=await response.json();
    $("apiStatus").textContent=`API: ${data.status}`;
  }catch{
    $("apiStatus").textContent="API: unavailable";
  }
}

try{setTheme(localStorage.getItem(THEME_KEY)||"dark");}catch{setTheme("dark");}
createTab();
checkApi();
</script>
</body>
</html>
