<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>Anura Browser V6</title>
<style>
:root{color-scheme:dark;--bg:#101722;--p:#182332;--p2:#223145;--line:#304156;--fg:#edf4fc;--muted:#9aabc0;--a:#8bc0ff;--ab:#29496d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px system-ui;background:var(--bg);color:var(--fg)}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column}.header,.tabbar,.toolbar,.status{background:var(--p)}.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.mark,.home-mark{display:grid;place-items:center;background:var(--ab);color:var(--a);font-weight:900;border-radius:10px}.mark{width:31px;height:31px}.brand-sub{font-size:10px;color:var(--muted)}.actions{display:flex;gap:5px}.icon,.nav{border:0;background:transparent;color:var(--muted);border-radius:8px}.icon{width:34px;height:34px}.tabbar{height:40px;display:flex;padding:4px 9px 0;border-bottom:1px solid var(--line);gap:5px}.tabs{display:flex;gap:5px;flex:1;overflow:auto}.tab{min-width:90px;max-width:180px;display:flex;align-items:center;gap:7px;padding:0 9px;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--muted);font-size:12px}.tab.active{background:var(--bg);border-color:var(--line);color:var(--fg)}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab-close{background:none;border:0;color:var(--muted)}.new-tab{width:30px;border:0;background:none;font-size:20px;color:var(--muted)}.toolbar{height:49px;display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line)}.nav{width:32px;height:32px;font-size:19px}.nav:disabled{opacity:.3}.address{height:35px;display:flex;align-items:center;gap:7px;flex:1;min-width:0;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.address input{min-width:0;width:100%;border:0;outline:0;background:none;font-size:12px}.go,.search button{border:0;border-radius:7px;background:var(--ab);color:var(--a);padding:6px 11px}.browser{position:relative;flex:1;min-height:0;background:white;overflow:hidden}.frames{position:absolute;inset:0}.frame{display:none;width:100%;height:100%;border:0;background:white}.frame.active{display:block}.home{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#293e56,#101722 72%)}.home.hidden{display:none}.home-inner{width:min(540px,100%);text-align:center}.home-mark{width:60px;height:60px;margin:0 auto 18px;font-size:30px}.home h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:9px 0 24px}.search{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #40536a;border-radius:10px;background:#1b2939}.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:white}.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}.shortcut{padding:9px 12px;border:1px solid #3b5068;border-radius:8px;background:#1b2939;color:#d6e2f0}.status{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.loading{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:#1b2939;color:white;font-size:11px}.loading.hidden{display:none}.panel{position:absolute;z-index:10;right:10px;top:60px;width:min(340px,calc(100vw - 20px));max-height:70vh;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--p)}.panel.hidden{display:none}.event{padding:8px;margin-top:6px;background:var(--p2);border-radius:7px;font-size:11px}.event small{display:block;color:var(--muted)}.focus .header,.focus .tabbar,.focus .toolbar,.focus .status{display:none}.focus .browser{position:fixed;inset:0;height:100dvh;z-index:20}.focus-exit{display:none;position:fixed;z-index:30;right:12px;top:12px}.focus .focus-exit{display:block}.light{color-scheme:light;--bg:#f3f6fa;--p:#fff;--p2:#edf2f8;--line:#dce4ee;--fg:#202b3a;--muted:#738196;--a:#2868bf;--ab:#e5effd}.light .home{background:radial-gradient(ellipse at 50% 40%,#e2ecf9,#f3f6fa 75%)}.light .search{background:white}.light .search input{color:#202b3a}.light .shortcut{background:white;color:#45536a;border-color:#dce4ee}@media(max-width:600px){.brand-sub{display:none}.toolbar{gap:2px;padding:5px 4px}.nav{width:28px}.go{padding:5px 8px}}
</style></head><body><div class="app" id="app">
<header class="header"><div class="brand"><div class="mark">A</div><div><b>Anura Browser</b><div class="brand-sub">Cloudflare Edition · V6</div></div></div><div class="actions"><button class="icon" id="securityBtn" title="Security Lab">◈</button><button class="icon" id="themeBtn" title="Đổi giao diện">◐</button><button class="icon" id="focusBtn" title="Focus mode">⛶</button></div></header>
<section class="tabbar"><div class="tabs" id="tabs"></div><button class="new-tab" id="newTab">+</button></section>
<section class="toolbar"><button class="nav" id="back" disabled>‹</button><button class="nav" id="forward" disabled>›</button><button class="nav" id="reload" disabled>↻</button><button class="nav" id="homeBtn">⌂</button><form class="address" id="addressForm"><span>⌕</span><input id="address" placeholder="Nhập địa chỉ hoặc tìm kiếm" autocomplete="off"><button class="go">Đi</button></form></section>
<main class="browser"><div class="frames" id="frames"></div><section class="home" id="home"><div class="home-inner"><div class="home-mark">A</div><h1>Anura Browser</h1><p class="sub">A quieter way to browse the web.</p><form class="search" id="homeForm"><span>⌕</span><input id="homeInput" placeholder="Tìm kiếm hoặc nhập website"><button>→</button></form><div class="shortcuts"><button class="shortcut" data-url="https://google.com">Google</button><button class="shortcut" data-url="https://github.com">GitHub</button><button class="shortcut" data-url="https://wikipedia.org">Wikipedia</button></div></div></section><div class="loading hidden" id="loading">Đang tải website…</div></main>
<footer class="status"><span id="status">Sẵn sàng</span><span id="apiStatus">API: đang kiểm tra…</span></footer><aside class="panel hidden" id="securityPanel"><b>Anura Security Lab</b><button id="closePanel" style="float:right">×</button><div id="events"></div><button id="clearEvents">Xóa nhật ký</button></aside><button class="focus-exit" id="exitFocus">Thoát Focus</button></div>
<script type="module">
const $=id=>document.getElementById(id),KEY='anura_v6_state',MAX_TABS=12,MAX_HISTORY=100;
const S={tabs:[],activeId:null,nextId:1,theme:'dark',events:[]};let timer=null,focus=false;
const valid=u=>{try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)&&!x.username&&!x.password}catch{return false}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:6,theme:S.theme,activeId:S.activeId,nextId:S.nextId,tabs:S.tabs.map(t=>({id:t.id,url:t.url,title:t.title,history:t.history,index:t.index})),events:S.events.slice(0,50)}))}catch{status('Không thể lưu dữ liệu trên thiết bị')}}
function status(x){$('status').textContent=x}function current(){return S.tabs.find(t=>t.id===S.activeId)}
function restore(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x||x.version!==6)return;S.theme=x.theme==='light'?'light':'dark';S.nextId=Number.isInteger(x.nextId)?x.nextId:1;S.events=Array.isArray(x.events)?x.events.slice(0,50):[];for(let t of (x.tabs||[]).slice(0,MAX_TABS)){if(!Number.isInteger(t.id))continue;let h=Array.isArray(t.history)?t.history.filter(valid).slice(-MAX_HISTORY):[];S.tabs.push({id:t.id,url:valid(t.url)?t.url:null,title:String(t.title||'Tab').slice(0,100),history:h,index:Math.max(-1,Math.min(h.length-1,Number(t.index)||0)),frame:null,loading:false})}S.activeId=S.tabs.some(t=>t.id===x.activeId)?x.activeId:null}catch{localStorage.removeItem(KEY)}}
function frameFor(t){let f=document.createElement('iframe');f.className='frame';f.title='Website content';f.referrerPolicy='strict-origin-when-cross-origin';f.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-modals allow-downloads');f.addEventListener('load',()=>{t.loading=false;if(S.activeId===t.id){clearTimeout(timer);$('loading').classList.add('hidden');status('Trang đã tải xong (nếu website cho phép nhúng)')}save();buttons()});t.frame=f;$('frames').append(f)}
function create(url=null){if(S.tabs.length>=MAX_TABS){status('Đã đạt giới hạn 12 tab');return}let t={id:S.nextId++,url:null,title:'Tab mới',history:[],index:-1,frame:null,loading:false};S.tabs.push(t);frameFor(t);activate(t.id);if(url)navigate(url)}
function activate(id){S.activeId=id;for(let t of S.tabs)t.frame.classList.toggle('active',t.id===id);let t=current();$('home').classList.toggle('hidden',!!t?.url);$('address').value=t?.url||'';$('loading').classList.toggle('hidden',!t?.loading);tabs();buttons();save()}
function tabs(){$('tabs').replaceChildren();for(let t of S.tabs){let b=document.createElement('button');b.className='tab'+(t.id===S.activeId?' active':'');let n=document.createElement('span');n.className='tab-title';n.textContent=t.title;let c=document.createElement('button');c.className='tab-close';c.textContent='×';c.onclick=e=>{e.stopPropagation();close(t.id)};b.append(n,c);b.onclick=()=>activate(t.id);$('tabs').append(b)}}
function close(id){let i=S.tabs.findIndex(t=>t.id===id);if(i<0)return;let was=S.activeId===id;S.tabs[i].frame.remove();S.tabs.splice(i,1);if(!S.tabs.length)create();else if(was)activate(S.tabs[Math.max(0,i-1)].id);else{tabs();save()}}
function normalize(v){v=String(v||'').trim();if(!v)return null;if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)){if(v.includes(' ')||!v.includes('.'))return 'https://www.google.com/search?q='+encodeURIComponent(v);return 'https://'+v}return v}
function navigate(raw){let u=normalize(raw);if(!u||!valid(u)){status('Chỉ hỗ trợ địa chỉ HTTP/HTTPS hợp lệ');return}let x=new URL(u);if(x.origin===location.origin){status('Không thể nhúng chính địa chỉ Anura');return}let t=current();if(!t)return;t.url=x.href;t.title=x.hostname;t.history=t.history.slice(0,t.index+1);t.history.push(t.url);t.index=t.history.length-1;t.loading=true;$('address').value=t.url;$('home').classList.add('hidden');$('loading').classList.remove('hidden');status('Đang tải '+x.hostname+'…');clearTimeout(timer);timer=setTimeout(()=>{t.loading=false;if(S.activeId===t.id){$('loading').classList.add('hidden');status('Website tải chậm hoặc chặn iframe. Anura không mở trình duyệt ngoài.')}save()},18000);t.frame.src=t.url;tabs();buttons();S.events.unshift({type:'navigation',detail:x.hostname,time:new Date().toISOString()});S.events=S.events.slice(0,50);save()}
function buttons(){let t=current();$('back').disabled=!t||t.index<=0;$('forward').disabled=!t||t.index>=t.history.length-1;$('reload').disabled=!t?.url}
function move(d){let t=current(),i=t?.index+d;if(!t||i<0||i>=t.history.length)return;t.index=i;t.url=t.history[i];t.title=new URL(t.url).hostname;t.loading=true;$('address').value=t.url;$('home').classList.add('hidden');$('loading').classList.remove('hidden');t.frame.src=t.url;buttons();save()}
function reload(){let t=current();if(!t?.url)return;t.loading=true;$('loading').classList.remove('hidden');t.frame.src=t.url;save()}
function home(){let t=current();if(!t)return;t.url=null;t.title='Tab mới';t.history=[];t.index=-1;t.loading=false;t.frame.removeAttribute('src');$('address').value='';$('home').classList.remove('hidden');$('loading').classList.add('hidden');status('Trang chủ');tabs();buttons();save()}
function theme(){S.theme=S.theme==='dark'?'light':'dark';document.body.classList.toggle('light',S.theme==='light');save()}
function renderEvents(){$('events').replaceChildren();for(let e of S.events.slice(0,20)){let d=document.createElement('div');d.className='event';d.textContent=e.type+' · '+(e.detail||'');let s=document.createElement('small');s.textContent=e.time||'';d.append(s);$('events').append(d)}}
$('addressForm').onsubmit=e=>{e.preventDefault();navigate($('address').value)};$('homeForm').onsubmit=e=>{e.preventDefault();navigate($('homeInput').value)};$('back').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('reload').onclick=reload;$('homeBtn').onclick=home;$('newTab').onclick=()=>create();$('themeBtn').onclick=theme;$('focusBtn').onclick=()=>{$('app').classList.add('focus');focus=true};$('exitFocus').onclick=()=>{$('app').classList.remove('focus');focus=false};$('securityBtn').onclick=()=>{$('securityPanel').classList.toggle('hidden');renderEvents()};$('closePanel').onclick=()=>$('securityPanel').classList.add('hidden');$('clearEvents').onclick=()=>{S.events=[];save();renderEvents()};document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>navigate(b.dataset.url));document.addEventListener('keydown',e=>{let m=e.ctrlKey||e.metaKey;if(e.key==='Escape'&&focus){$('app').classList.remove('focus');focus=false}if(m&&e.key.toLowerCase()==='t'){e.preventDefault();create()}if(m&&e.key.toLowerCase()==='w'){e.preventDefault();let t=current();if(t)close(t.id)}if(m&&e.key.toLowerCase()==='r'){e.preventDefault();reload()}if(m&&e.key.toLowerCase()==='l'&&!focus){e.preventDefault();$('address').focus();$('address').select()}if(e.altKey&&e.key==='ArrowLeft')move(-1);if(e.altKey&&e.key==='ArrowRight')move(1)});
async function api(){try{let r=await fetch('/api/health');if(!r.ok)throw Error();let d=await r.json();$('apiStatus').textContent='API: '+d.status}catch{$('apiStatus').textContent='API: offline'}}
restore();document.body.classList.toggle('light',S.theme==='light');if(!S.tabs.length)create();else{S.tabs.forEach(frameFor);S.tabs.forEach(t=>{if(t.url){t.loading=true;t.frame.src=t.url}});activate(S.activeId||S.tabs[0].id)}api();
</script></body></html>
